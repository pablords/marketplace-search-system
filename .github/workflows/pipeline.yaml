name: CI/CD Pipeline - Marketplace Search System

env:
  DOCKER_REPO: "pablords"
  ENABLE_CODE_REVIEW: 'false'

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-api-gateway:
    name: Build API Gateway (Go)
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.go-version.outputs.VERSION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api-gateway/go.mod'

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get Go Version
        id: go-version
        run: |
          cd api-gateway
          VERSION=$(grep -E '^go ' go.mod | awk '{print $2}' | sed 's/\.0$//')
          echo "VERSION=${VERSION:-1.0.0}" >> $GITHUB_ENV
          echo "VERSION=${VERSION:-1.0.0}" >> $GITHUB_OUTPUT

      - name: Build API Gateway
        working-directory: api-gateway
        run: |
          go mod download
          go build -o gateway cmd/gateway/main.go

      - name: Run Go Tests
        working-directory: api-gateway
        run: go test ./... -v

  build-java-services:
    name: Build Java Microservices
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.project-version.outputs.VERSION }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Get Project Version
        id: project-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || echo "1.0.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Java Services
        run: |
          mvn clean package -DskipTests -pl catalog-service/bootstrap,indexing-service/bootstrap,search-service/bootstrap -am

      - name: Run Unit Tests
        run: mvn test -pl catalog-service,indexing-service,search-service

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: [build-api-gateway, build-java-services]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'api-gateway/go.mod'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Java Static Analysis
        run: mvn verify -DskipTests -pl catalog-service,indexing-service,search-service

      - name: Run Go Linting
        working-directory: api-gateway
        run: |
          go install golang.org/x/tools/cmd/goimports@latest || true
          go vet ./...

      - name: OWASP Dependency Check (Java)
        run: mvn org.owasp:dependency-check-maven:check -pl catalog-service,indexing-service,search-service || true

  package:
    name: Package Docker Images
    runs-on: ubuntu-latest
    needs: [build-api-gateway, build-java-services]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || echo "1.0.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Build API Gateway (Go)
      - name: Build and Push API Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/api-gateway:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Catalog Service (Java) - apenas se Dockerfile existir
      - name: Check Catalog Service Dockerfile
        id: check-catalog-dockerfile
        run: |
          if [ -f "./catalog-service/bootstrap/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Catalog Service Image
        if: steps.check-catalog-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./catalog-service
          file: ./catalog-service/bootstrap/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/catalog-service:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/catalog-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Indexing Service (Java) - apenas se Dockerfile existir
      - name: Check Indexing Service Dockerfile
        id: check-indexing-dockerfile
        run: |
          if [ -f "./indexing-service/bootstrap/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Indexing Service Image
        if: steps.check-indexing-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./indexing-service
          file: ./indexing-service/bootstrap/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/indexing-service:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/indexing-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Search Service (Java) - apenas se Dockerfile existir
      - name: Check Search Service Dockerfile
        id: check-search-dockerfile
        run: |
          if [ -f "./search-service/bootstrap/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Search Service Image
        if: steps.check-search-dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./search-service
          file: ./search-service/bootstrap/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/search-service:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/search-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build ML Ranking Service (Python)
      - name: Build and Push ML Ranking Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-ranking-service
          file: ./ml-ranking-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/ml-ranking-service:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/ml-ranking-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

      # Build ML Embedding Service (Python)
      - name: Build and Push ML Embedding Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-embedding-service
          file: ./ml-embedding-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/ml-embedding-service:${{ env.VERSION }}
            ${{ env.DOCKER_REPO }}/ml-embedding-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null || echo "1.0.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Deploy Application
        run: |
          echo "🚀 Deploy Marketplace Search System"
          echo "Version: ${{ env.VERSION }}"
          echo "Docker Images:"
          echo "  - ${{ env.DOCKER_REPO }}/api-gateway:${{ env.VERSION }}"
          echo "  - ${{ env.DOCKER_REPO }}/catalog-service:${{ env.VERSION }}"
          echo "  - ${{ env.DOCKER_REPO }}/indexing-service:${{ env.VERSION }}"
          echo "  - ${{ env.DOCKER_REPO }}/search-service:${{ env.VERSION }}"
          echo "  - ${{ env.DOCKER_REPO }}/ml-ranking-service:${{ env.VERSION }}"
          echo "  - ${{ env.DOCKER_REPO }}/ml-embedding-service:${{ env.VERSION }}"
          # TODO: Adicione os comandos para realizar o deploy
          # Exemplos:
          # - kubectl apply -f k8s/
          # - docker-compose -f docker-compose.prod.yml up -d
          # - aws ecs update-service --cluster marketplace --service search-api
