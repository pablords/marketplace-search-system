spring:
  # DevTools para hot reload
  devtools:
    restart:
      enabled: true
      additional-paths: 
        - ../interfaces/src/main/java
      poll-interval: 1000ms
      quiet-period: 400ms
    livereload:
      enabled: true
      port: 35729
    add-properties: true

  # Resource chain disabled para hot reload
  web:
    resources:
      cache:
        period: 0s
      chain:
        cache: false

# Logging mais verboso para desenvolvimento
logging:
  level:
    com.marketplace.search.gateway: DEBUG
    org.springframework.web: INFO
    org.springframework.web.reactive: DEBUG

# Management para desenvolvimento
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator

