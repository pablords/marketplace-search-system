spring:
  application:
    name: api-gateway
  
  profiles:
    active: development

  output:
    ansi:
      enabled: always

# Logging
logging:
  level:
    com.marketplace.search.gateway: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level){blue} %clr(%logger{36}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      enabled: true
    tags:
      application: api-gateway
      environment: ${ENVIRONMENT:development}

# Server
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

# External Services Configuration
services:
  catalog:
    base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8081/api/v1}
    timeout: ${CATALOG_SERVICE_TIMEOUT:5000}
    retry:
      max-attempts: ${CATALOG_SERVICE_RETRY_MAX_ATTEMPTS:3}
      min-backoff: ${CATALOG_SERVICE_RETRY_MIN_BACKOFF:500}
    circuit-breaker:
      failure-rate-threshold: ${CATALOG_SERVICE_CB_FAILURE_RATE_THRESHOLD:50}
      wait-duration-in-open-state: ${CATALOG_SERVICE_CB_WAIT_DURATION:10000}
      sliding-window-size: ${CATALOG_SERVICE_CB_SLIDING_WINDOW_SIZE:10}
  search:
    base-url: ${SEARCH_SERVICE_BASE_URL:http://localhost:8083/api/v1}
    timeout: ${SEARCH_SERVICE_TIMEOUT:3000}
    retry:
      max-attempts: ${SEARCH_SERVICE_RETRY_MAX_ATTEMPTS:3}
      min-backoff: ${SEARCH_SERVICE_RETRY_MIN_BACKOFF:500}
    circuit-breaker:
      failure-rate-threshold: ${SEARCH_SERVICE_CB_FAILURE_RATE_THRESHOLD:50}
      wait-duration-in-open-state: ${SEARCH_SERVICE_CB_WAIT_DURATION:10000}
      sliding-window-size: ${SEARCH_SERVICE_CB_SLIDING_WINDOW_SIZE:10}

