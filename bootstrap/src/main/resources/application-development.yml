spring:
  # DevTools para hot reload em projeto multi-módulo
  devtools:
    restart:
      enabled: true
      additional-paths: 
        - ../domain/src/main/java
        - ../application/src/main/java
        - ../infrastructure/src/main/java
        - ../interfaces/src/main/java
      additional-exclude: 
        - static/**
        - public/**
        - templates/**
        - target/**
      poll-interval: 1000ms
      quiet-period: 400ms
    livereload:
      enabled: true
      port: 35729
    add-properties: true
  
  # Datasource para desenvolvimento
  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_search_dev
    username: dev_user
    password: dev_password
  
  # JPA para desenvolvimento
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  # Redis para desenvolvimento
  redis:
    host: localhost
    port: 6379
    database: 1  # Use database 1 for dev
  
  # Cache desabilitado em desenvolvimento
  cache:
    type: none
  
  # Resource chain disabled para hot reload
  web:
    resources:
      cache:
        period: 0s
      chain:
        cache: false

# Elasticsearch para desenvolvimento
elasticsearch:
  indices:
    products: marketplace-products-dev

# Logging mais verboso para desenvolvimento
logging:
  level:
    com.marketplace.search: DEBUG
    org.springframework.kafka: DEBUG
    org.elasticsearch: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.elasticsearch: DEBUG

# Management para desenvolvimento
management:
  endpoints:
    web:
      exposure:
        include: "*"

# Application config para desenvolvimento
marketplace:
  search:
    analytics:
      enabled: true
      sample-rate: 1.0  # 100% sampling for development