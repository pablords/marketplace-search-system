spring:
  # DevTools para hot reload em projeto multi-módulo
  devtools:
    restart:
      enabled: true
      additional-paths: 
        - ../domain/src/main/java
        - ../application/src/main/java
        - ../infrastructure/src/main/java
        - ../interfaces/src/main/java
      additional-exclude: 
        - static/**
        - public/**
        - templates/**
        - target/**
      poll-interval: 1000ms
      quiet-period: 400ms
    livereload:
      enabled: true
      port: 35729
    add-properties: true

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace
    username: marketplace
    password: marketplace123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none  # Schema gerenciado por migrations ou script SQL
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Redis para desenvolvimento
  redis:
    host: localhost
    port: 6379
    database: 1  # Use database 1 for dev
  
  # Cache desabilitado em desenvolvimento
  cache:
    type: none
  
  # Resource chain disabled para hot reload
  web:
    resources:
      cache:
        period: 0s
      chain:
        cache: false
  
  # Kafka configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: marketplace-search-elasticsearch-indexer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      properties:
        session.timeout.ms: 30000
        max.poll.interval.ms: 300000
    producer:
      client-id: marketplace-search-producer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

# Elasticsearch para desenvolvimento
elasticsearch:
  indices:
    products: products

# Kafka topics para desenvolvimento
kafka:
  topics:
    product-events: marketplace.public.products
  consumer:
    group-id: marketplace-search-elasticsearch-indexer

# Logging mais verboso para desenvolvimento
logging:
  level:
    com.marketplace.search: DEBUG
    # Kafka logging habilitado para debug do CDC
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    com.marketplace.search.infrastructure.kafka: DEBUG
    # Elasticsearch logging silenciado
    org.elasticsearch: OFF
    org.springframework.data.elasticsearch: OFF
    co.elastic.clients: OFF
    # Outros logs relacionados
    org.springframework.web: WARN
    org.springframework.security: WARN

# Management para desenvolvimento
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator

# Application config para desenvolvimento
marketplace:
  search:
    cache:
      enabled: true
    analytics:
      enabled: true
      sample-rate: 1.0  # 100% sampling for development