spring:
  # DevTools para hot reload em projeto multi-módulo
  devtools:
    restart:
      enabled: true
      additional-paths: 
        - ../domain/src/main/java
        - ../application/src/main/java
        - ../infrastructure/src/main/java
        - ../interfaces/src/main/java
      additional-exclude: static/**, public/**, templates/**, target/**
      poll-interval: 1000ms
      quiet-period: 400ms
    livereload:
      enabled: true
      port: 35729
    add-properties: true
    

  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER:catalog}
    password: ${POSTGRES_PASSWORD:catalog}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none  # Schema gerenciado por migrations ou script SQL
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Configuração para executar scripts SQL na inicialização
  sql:
    init:
      mode: always  # Executa sempre (embedded, always, never)
      schema-locations: classpath:data/migrations/v1_create_tables.sql
      data-locations: classpath:data/seed.sql
      continue-on-error: true  # Continua mesmo se houver erros (tabela já existe)
      separator: ";"

  
  # Resource chain disabled para hot reload
  web:
    resources:
      cache:
        period: 0s
      chain:
        cache: false
  


# Logging mais verboso para desenvolvimento
logging:
  level:
    com.marketplace.search: DEBUG
    # Kafka logging habilitado para debug do CDC
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    com.marketplace.search.infrastructure.kafka: DEBUG
    # Elasticsearch logging silenciado
    org.elasticsearch: OFF
    org.springframework.data.elasticsearch: OFF
    co.elastic.clients: OFF
    # Outros logs relacionados
    org.springframework.web: WARN
    org.springframework.security: WARN

# Management para desenvolvimento
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator

