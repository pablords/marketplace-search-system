spring:
  datasource:
    url: jdbc:postgresql://${DB_HOSTNAME}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER:catalog}
    password: ${POSTGRES_PASSWORD:catalog}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Configuração para executar scripts SQL na inicialização
  sql:
    init:
      mode: always
      schema-locations: classpath:data/migrations/v1_create_tables.sql
      data-locations: classpath:data/seed.sql
      continue-on-error: true
      separator: ";"

  # Redis para produção
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      ssl: 
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20

# Logging para produção
logging:
  level:
    com.marketplace.search: INFO
    org.springframework.kafka: WARN
    org.elasticsearch: WARN
    org.springframework.data.elasticsearch: WARN
  file:
    name: /var/log/marketplace-search/application.log

# Management para produção
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Server para produção
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-threads: 200
    min-spare-threads: 20