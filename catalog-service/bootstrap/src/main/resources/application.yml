spring:
  application:
    name: catalog

  threads:
    virtual:
      enabled: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}

  output:
    ansi:
      enabled: never

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Logging
logging:
  level:
    com.marketplace.search: ${LOG_LEVEL:INFO}

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      enabled: true
    distribution:
      percentiles-histogram:
        spring.data.repository.invocations: true
        http.server.requests: true
        jvm.gc.pause: true
  observation:
    key-values:
      application: catalog-service
      environment: ${SPRING_PROFILES_ACTIVE:production}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

# Server
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

debezium:
  connector:
    name: catalog-products-connector
    url: ${DEBEZIUM_CONNECTOR_URL}
    config:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      tasks.max: 1
      database.hostname: ${DB_HOSTNAME_CONTAINER}
      database.port: ${POSTGRES_PORT:5432}
      database.user: ${POSTGRES_USER}
      database.password: ${POSTGRES_PASSWORD}
      # ALTERAÇÃO CRÍTICA: Agora o Debezium usa uma variável exclusiva, limpa de parâmetros JDBC
      database.dbname: ${DEBEZIUM_DB_NAME:catalog}
      database.server.name: ${KAFKA_TOPIC_PREFIX:catalog-db}
      table.include.list: ${POSTGRES_TABLES}
      topic.prefix: ${KAFKA_TOPIC_PREFIX:catalog-db}
      snapshot.mode: initial
      plugin.name: pgoutput
      schema.include: public
      key.converter: org.apache.kafka.connect.json.JsonConverter
      key.converter.schemas.enable: false
      value.converter: org.apache.kafka.connect.json.JsonConverter
      value.converter.schemas.enable: false
      decimal.handling.mode: string
      topic.creation.default.partitions: 3
      topic.creation.default.replication.factor: 3
      topic.creation.default.replicas.assignment.retry.delay.ms: 10000