spring:
  application:
    name: catalog

  threads:
    virtual:
      enabled: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}

  output:
    ansi:
      enabled: never

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry.kafka.svc.cluster.local:8081}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      group-id: catalog-service-group
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: true
    listener:
      type: batch
      concurrency: 3
    template:
      default-topic: catalog.product.create.requests
      dlq-topic: catalog.product.create.dlq

# Logging
logging:
  level:
    com.marketplace.search: ${LOG_LEVEL:INFO}

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      enabled: true
    distribution:
      percentiles-histogram:
        spring.data.repository.invocations: true
        http.server.requests: true
        jvm.gc.pause: true
  observation:
    key-values:
      application: catalog-service
      environment: ${SPRING_PROFILES_ACTIVE:production}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

# Server
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

debezium:
  connector:
    name: catalog-products-connector
    url: ${DEBEZIUM_CONNECTOR_URL}
    config:
      connector.class: io.debezium.connector.postgresql.PostgresConnector
      tasks.max: 1
      database.hostname: ${DB_HOSTNAME_CONTAINER}
      database.port: ${POSTGRES_PORT:5432}
      database.user: ${POSTGRES_USER}
      database.password: ${POSTGRES_PASSWORD}
      # ALTERAÇÃO CRÍTICA: Agora o Debezium usa uma variável exclusiva, limpa de parâmetros JDBC
      database.dbname: ${DEBEZIUM_DB_NAME:catalog}
      database.server.name: ${KAFKA_TOPIC_PREFIX:catalog-db}
      table.include.list: ${POSTGRES_TABLES}
      topic.prefix: ${KAFKA_TOPIC_PREFIX:catalog-db}
      snapshot.mode: initial
      plugin.name: pgoutput
      schema.include: public
      key.converter: io.confluent.connect.avro.AvroConverter
      key.converter.schema.registry.url: http://schema-registry.kafka.svc.cluster.local:8081
      value.converter: io.confluent.connect.avro.AvroConverter
      value.converter.schema.registry.url: http://schema-registry.kafka.svc.cluster.local:8081
      decimal.handling.mode: string
      topic.creation.default.partitions: 3
      topic.creation.default.replication.factor: 30     # Total de Consumidores Ativos = 10  Pods × 3  threads/Pod = 30  threads
      topic.creation.default.replicas.assignment.retry.delay.ms: 10000