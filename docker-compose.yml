x-logging: &default-logging
  driver: fluentd
  options:
    fluentd-address: "127.0.0.1:24224"
    tag: docker.{{.Name}}
    fluentd-async: "true"

services:
  # Traefik Gateway
  traefik:
    image: traefik:v2.10
    container_name: marketplace-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=marketplace-network"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:8888"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog.format=json"
    ports:
      - "8888:8888"  # Porta HTTP principal
      - "443:443"
      - "8080:8080"  # Dashboard (apenas interno)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      - CACHE_SEARCH_TTL_SECONDS=300
    networks:
      - marketplace-network
    depends_on:
      - api-gateway
    restart: unless-stopped

  # PostgreSQL Database
  catalog-db:
    image: postgres:15-alpine
    container_name: catalog-db
    env_file:
      - ./catalog-service/.env
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./docker/postgres/00-init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql
      # - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: marketplace-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-catalog}:${POSTGRES_PASSWORD:-catalog}@catalog-db:5432/${POSTGRES_DB:-catalog}?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - marketplace-network
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - marketplace-network
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: marketplace-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - marketplace-network
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # OpenSearch e OpenSearch Dashboards
  open-search:
    image: opensearchproject/opensearch:3
    container_name: marketplace-opensearch
    ports:
      - "9200:9200"
      - "9600:9600"
    depends_on:
      - redis
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - "DISABLE_SECURITY_PLUGIN=true" # Disables Security plugin
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - marketplace-network
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # OpenSearch Exporter
  opensearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: marketplace-opensearch-exporter
    command:
      - '--es.uri=http://open-search:9200'
      - '--es.all'
      - '--es.indices'
      - '--es.cluster_settings'
    ports:
      - "9114:9114"
    networks:
      - marketplace-network
    depends_on:
      open-search:
        condition: service_healthy
    restart: unless-stopped

  # Fluent Bit - Coletor de logs centralizado
  fluent-bit:
    image: fluent/fluent-bit:3.2
    container_name: marketplace-fluent-bit
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./docker/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./docker/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    networks:
      - marketplace-network
    depends_on:
      open-search:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: cria index template e ILM policy no OpenSearch
  opensearch-init:
    image: curlimages/curl:latest
    container_name: marketplace-opensearch-init
    volumes:
      - ./docker/opensearch/init-log-index.sh:/init-log-index.sh:ro
    entrypoint: ["/bin/sh", "/init-log-index.sh"]
    networks:
      - marketplace-network
    depends_on:
      open-search:
        condition: service_healthy
    restart: "no"

  # opensearch-dashboards:
  #   image: opensearchproject/opensearch-dashboards:3
  #   container_name: marketplace-opensearch-dashboards
  #   depends_on:
  #     - open-search
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.opensearch.rule=PathPrefix(`/opensearch-dashboards`)"
  #     - "traefik.http.routers.opensearch.entrypoints=web"
  #     - "traefik.http.services.opensearch.loadbalancer.server.port=5601"
  #     - "traefik.http.routers.opensearch.middlewares=opensearch-stripprefix"
  #   environment:
  #     - 'OPENSEARCH_HOSTS=["http://open-search:9200"]'
  #     - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true" # disables security dashboards plugin in OpenSearch Dashboards
  #   networks:
  #     - marketplace-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5

  # Zookeeper (para Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: marketplace-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_DATA_DIR: /var/lib/zookeeper/data
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - marketplace-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: marketplace-kafka
    ports:
      - "29092:29092"  # Porta interna para comunicação entre containers
      - "9092:9092"    # Porta exposta para host (desenvolvimento)
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kafka UI (opcional, para gerenciamento)
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: marketplace-kafka-ui
  #   depends_on:
  #     - kafka
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #   networks:
  #     - marketplace-network

  # Kafka Connect com Debezium
  kafka-connect:
    image: debezium/connect:2.6.0.Final
    container_name: marketplace-kafka-connect
    depends_on:
      - kafka
      - catalog-db
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Configurações adicionais para garantir conectividade
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_ADVERTISED_PORT: 8083
      CONNECT_REST_HOST_NAME: 0.0.0.0
      CONNECT_REST_PORT: 8083
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /kafka/connect
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    ports:
      - "8083:8083"
    

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: marketplace-otel-collector
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./docker/otel-collector/otelcol-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    networks:
      - marketplace-network
    depends_on:
      - jaeger
    restart: unless-stopped

  # Jaeger (all-in-one com storage em memória)
  # Usa all-in-one para compartilhar storage entre collector e query
  # O OTEL Collector envia traces para o Jaeger Collector via gRPC
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: marketplace-jaeger
    environment:
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - QUERY_BASE_PATH=/jaeger
    ports:
      - "16686:16686"  # Query UI (acessível via Traefik em /jaeger)
      # Portas 4317 e 4318 não precisam ser expostas - comunicação interna via rede Docker
    # Rota configurada no arquivo dynamic.yml do Traefik
    networks:
      - marketplace-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Blackbox Exporter - probe HTTP para serviços sem /metrics nativo (ML services)
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: marketplace-blackbox-exporter
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./docker/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - marketplace-network
    restart: unless-stopped

  # Prometheus (para métricas)
  prometheus:
    image: prom/prometheus:latest
    container_name: marketplace-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    networks:
      - marketplace-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Grafana (para visualização de métricas)
  grafana:
    image: grafana/grafana:latest
    container_name: marketplace-grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.priority=20"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-opensearch-datasource
      - GF_SERVER_ROOT_URL=http://localhost:8888/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - marketplace-network
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  # Debezium UI
  # debezium-ui:
  #   image: quay.io/debezium/debezium-ui:latest
  #   container_name: marketplace-debezium-ui
  #   depends_on:
  #     - kafka-connect
  #   environment:
  #     KAFKA_CONNECT_URIS: http://kafka-connect:8083
  #   networks:
  #     - marketplace-network

  # ML Ranking Service
  ml-ranking-service:
    build:
      context: ./ml-ranking-service
      dockerfile: Dockerfile
    container_name: marketplace-ml-ranking
    env_file:
      - ./ml-ranking-service/.env
    depends_on:
      redis:
        condition: service_healthy
      open-search:
        condition: service_healthy
    networks:
      - marketplace-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Embedding Service
  ml-embedding-service:
    build:
      context: ./ml-embedding-service
      dockerfile: Dockerfile
    container_name: marketplace-embedding
    env_file:
      - ./ml-embedding-service/.env
    depends_on:
      redis:
        condition: service_healthy
      open-search:
        condition: service_healthy
    networks:
      - marketplace-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Catalog Service
  catalog-service:
    build:
      context: .
      dockerfile: ./catalog-service/Dockerfile
    container_name: marketplace-catalog-service
    env_file:
      - ./catalog-service/.env
    depends_on:
      catalog-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - marketplace-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Search Service
  search-service:
    build:
      context: .
      dockerfile: ./search-service/Dockerfile
    container_name: marketplace-search-service
    env_file:
      - ./search-service/.env
    depends_on:
      open-search:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-embedding-service:
        condition: service_healthy
      ml-ranking-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - marketplace-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Indexing Service
  indexing-service:
    build:
      context: .
      dockerfile: ./indexing-service/Dockerfile
    container_name: marketplace-indexing-service
    env_file:
      - ./indexing-service/.env
    depends_on:
      kafka:
        condition: service_healthy
      open-search:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-embedding-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - marketplace-network
    logging: *default-logging
    healthcheck:
      # Usa o endpoint de liveness que é mais simples e não verifica dependências
      # Isso evita que o serviço fique amarelo quando dependências têm problemas temporários
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/api/v1/actuator/health/liveness || wget --no-verbose --tries=1 --spider http://localhost:8082/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # API Gateway (Go)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: marketplace-api-gateway
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.middlewares=cache-search@file"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    env_file:
      - ./api-gateway/.env
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - marketplace-network
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/v1/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  prometheus_data:
  grafana_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  fluent_bit_db:

networks:
  marketplace-network:
    driver: bridge