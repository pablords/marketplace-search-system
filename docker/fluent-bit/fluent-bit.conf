[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

[FILTER]
    Name          parser
    Match         docker.marketplace-*-service
    Key_Name      log
    Parser        springboot_json
    Parser        springboot
    Reserve_Data  On
    Preserve_Key  On


[FILTER]
    Name          parser
    Match         docker.marketplace-ml-ranking
    Key_Name      log
    Parser        python
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         docker.marketplace-embedding
    Key_Name      log
    Parser        python
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          parser
    Match         docker.marketplace-api-gateway
    Key_Name      log
    Parser        json_message
    Reserve_Data  On
    Preserve_Key  On

[FILTER]
    Name          lua
    Match         *
    Script        /fluent-bit/etc/cleanup.lua
    Call          cleanup_log

# Extrai o nome do serviço da tag docker (docker.marketplace-catalog-service → catalog-service)
[FILTER]
    Name          lua
    Match         docker.*
    Script        /fluent-bit/etc/extract_service.lua
    Call          extract_service_name

[FILTER]
    Name          grep
    Match         *
    Exclude       log actuator/health
    Exclude       log /_cluster/health
    Exclude       message Request received

[FILTER]
    Name          record_modifier
    Match         *
    Record        environment production
    Record        stack marketplace-search-system

[OUTPUT]
    Name                  opensearch
    Match                 *
    Host                  open-search
    Port                  9200
    Index                 marketplace-logs
    Logstash_Format       On
    Logstash_Prefix       marketplace-logs
    Logstash_DateFormat   %Y.%m.%d
    Buffer_Size           5M
    Generate_ID           On
    Retry_Limit           False
    tls                   Off
    tls.verify            Off
    Suppress_Type_Name    On
    Trace_Error           On
    Trace_Output          Off
    Workers               2
