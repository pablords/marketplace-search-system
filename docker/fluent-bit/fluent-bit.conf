[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     debug
    Parsers_File  /fluent-bit/etc/parsers.conf

# ── INPUT ──────────────────────────────────────────────────────────────────
[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Docker_Mode       On
    Docker_Mode_Flush 5
    DB                /var/lib/fluent-bit/flb_docker.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10

# ── FILTERS ────────────────────────────────────────────────────────────────
# Tenta parsear o campo 'log' como JSON (logs estruturados dos serviços)
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        json_message
    Reserve_Data  On
    Preserve_Key  On

# Descarta logs de health checks repetitivos para não poluir o índice
[FILTER]
    Name    grep
    Match   docker.*
    Exclude log   actuator/health
    Exclude log   /_cluster/health

# Adiciona campo environment fixo para filtragem
[FILTER]
    Name    record_modifier
    Match   docker.*
    Record  environment production
    Record  stack      marketplace-search-system

# ── OUTPUT ─────────────────────────────────────────────────────────────────

[OUTPUT]
    Name                  opensearch
    Match                 docker.*
    Host                  open-search
    Port                  9200
    Index                 marketplace-logs
    Logstash_Format       On
    Logstash_Prefix       marketplace-logs
    Logstash_DateFormat   %Y.%m.%d
    Time_Key              @timestamp
    Generate_ID           On
    Retry_Limit           3
    tls                   Off
    tls.verify            Off
    Suppress_Type_Name    On
    Trace_Error           On
