global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'marketplace-search'
    environment: 'development'

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway (Go)
  - job_name: 'api-gateway'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['api-gateway:8080']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Catalog Service
  - job_name: 'catalog-service'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['catalog-service:8081']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Search Service
  - job_name: 'search-service'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['search-service:8083']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Indexing Service
  - job_name: 'indexing-service'
    metrics_path: '/api/v1/actuator/prometheus'
    static_configs:
      - targets: ['indexing-service:8082']
    scrape_interval: 10s
    scrape_timeout: 5s

  # ML Ranking Service
  - job_name: 'ml-ranking-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-ranking-service:8084']
    scrape_interval: 10s
    scrape_timeout: 5s

  # ML Embedding Service
  - job_name: 'ml-embedding-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ml-embedding-service:8085']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # OpenSearch metrics (via elasticsearch_exporter)
  - job_name: 'opensearch'
    static_configs:
      - targets: ['opensearch-exporter:9114']
    scrape_interval: 30s

  # Redis metrics (via redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Kafka metrics (if using kafka_exporter)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
    scrape_interval: 30s
