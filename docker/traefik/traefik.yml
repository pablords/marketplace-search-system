# Configuração estática do Traefik
api:
  dashboard: true
  insecure: false  # Dashboard apenas interno

entryPoints:
  web:
    address: ":8888"  # Porta alterada de 80 para 8888 devido a bloqueios de rede
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: marketplace-network
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json

