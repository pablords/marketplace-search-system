spring:
  application:
    name: indexing-service

  threads:
    virtual:
      enabled: true
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}

  output:
    ansi:
      enabled: never
  
    # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    dlq:
      partitions: ${KAFKA_DLQ_PARTITIONS:30} # Alterado de 3 para 30
    properties:
      schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry.kafka.svc.cluster.local:8081}
    consumer:
      group-id: indexing-service-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.confluent.kafka.serializers.KafkaAvroDeserializer
        specific.avro.reader: false


# OpenSearch
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index:
    products: ${OPENSEARCH_PRODUCTS_INDEX:products-index}

# ML Feature Store Configuration
ml:
  feature-store:
    # Feature Store Online (Redis)
    ttl-seconds: ${ML_FEATURE_STORE_TTL:3600}  # 1 hora
    redis-key-prefix: ${ML_FEATURE_STORE_REDIS_PREFIX:feature:ml:}
    
    # Feature Store Offline (PostgreSQL) - para uso futuro
    offline:
      enabled: ${ML_FEATURE_STORE_OFFLINE_ENABLED:false}
      version: ${ML_FEATURE_STORE_VERSION:1.0}

# Embedding Service Configuration
embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:8085}
    timeout-seconds: ${EMBEDDING_SERVICE_TIMEOUT:30}
    max-retries: ${EMBEDDING_SERVICE_MAX_RETRIES:3}
    enabled: ${EMBEDDING_SERVICE_ENABLED:true}

# Kafka Topics
kafka:
  topics:
    product-events: ${KAFKA_PRODUCT_EVENTS_TOPIC:catalog-db.public.products}
    product-events-dlq: ${KAFKA_PRODUCT_EVENTS_DLQ_TOPIC:catalog-db.public.products.dlq}
    brand-events: ${KAFKA_BRAND_EVENTS_TOPIC:catalog-db.public.brands}
    category-events: ${KAFKA_CATEGORY_EVENTS_TOPIC:catalog-db.public.categories}
    seller-events: ${KAFKA_SELLER_EVENTS_TOPIC:catalog-db.public.sellers}
    product-metrics-events: ${KAFKA_PRODUCT_METRICS_EVENTS_TOPIC:catalog-db.public.product_metrics}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:marketplace-search-indexer-service}
  dlq:
    # Número de partições e replication-factor do tópico DLQ
    partitions: ${KAFKA_DLQ_PARTITIONS:3}
    replication-factor: ${KAFKA_DLQ_REPLICATION_FACTOR:1}
  # Configuração de deduplicação de eventos
  # TTL em horas para chaves de deduplicação no Redis (padrão: 7 dias = 168 horas)
  deduplication:
    ttl-hours: ${KAFKA_DEDUPLICATION_TTL_HOURS:168}

# Logging
logging:
  level:
    com.marketplace.search: ${LOG_LEVEL:INFO}


# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    # Configuração de health checks para dependências
    # Kafka e Redis são verificados, mas não são críticos para o liveness
    kafka:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: false
    ping:
      enabled: true
    # Liveness probe - verifica apenas se a aplicação está rodando
    livenessstate:
      enabled: true
    # Readiness probe - verifica se está pronto para receber tráfego
    readinessstate:
      enabled: true
    metrics:
      enabled: true
  metrics:
    export:
      enabled: true
    distribution:
      percentiles-histogram:
        jvm.gc.pause: true
    tags:
      application: marketplace-search-system
      environment: ${ENVIRONMENT:production}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

# Server
server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false