spring:
  application:
    name: indexing-service
  
  profiles:
    active: development

  output:
    ansi:
      enabled: always
  
    # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: indexing-service-consumer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer


# OpenSearch
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index:
    products: ${OPENSEARCH_PRODUCTS_INDEX:products-index}

# Kafka Topics
kafka:
  topics:
    product-events: ${KAFKA_PRODUCT_EVENTS_TOPIC:catalog-db.public.products}
    brand-events: ${KAFKA_BRAND_EVENTS_TOPIC:catalog-db.public.brands}
    category-events: ${KAFKA_CATEGORY_EVENTS_TOPIC:catalog-db.public.categories}
    seller-events: ${KAFKA_SELLER_EVENTS_TOPIC:catalog-db.public.sellers}
    product-metrics-events: ${KAFKA_PRODUCT_METRICS_EVENTS_TOPIC:catalog-db.public.product_metrics}
  consumer:
    group-id: ${KAFKA_CONSUMER_GROUP_ID:marketplace-search-indexer-service}

# Logging
logging:
  level:
    com.marketplace.search: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){magenta} %clr(%-5level){blue} %clr(%logger{36}){cyan} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/marketplace-search.log

# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      enabled: true
    tags:
      application: marketplace-search-system
      environment: ${ENVIRONMENT:development}

# Server
server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false