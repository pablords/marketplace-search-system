name: CI/CD Pipeline - Marketplace Search System

env:
  DOCKER_REPO: "pablords"
  ENABLE_CODE_REVIEW: 'false'

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.project-version.outputs.VERSION }}

    steps:
      # Checkout do código
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configura a versão do Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Cache do Maven
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Obtém a versão do projeto
      - name: Get Project Version
        id: project-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Build da aplicação (multi-módulo)
      - name: Build Application
        run: mvn clean package -DskipTests

      # Executar testes unitários
      - name: Run Unit Tests
        run: mvn test

      # Gerar relatório de cobertura
      - name: Generate Coverage Report
        run: mvn jacoco:report

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Análise estática de código
      - name: Run Static Analysis
        run: mvn verify -DskipTests

      # Verificação de segurança com OWASP Dependency Check
      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check || true



  package:
    name: Package Application as Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Checkout do código
      - name: Checkout Code
        uses: actions/checkout@v4

      # Configura a versão do Java (necessário para o build no Docker)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # Cache do Maven
      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build da aplicação novamente (para gerar o JAR)
      - name: Build Application
        run: mvn clean package -DskipTests

      # Debug para verificar o JAR gerado
      - name: Verify JAR
        run: |
          echo "Listing bootstrap/target directory:"
          ls -la bootstrap/target/
          echo "VERSION=${{ needs.build.outputs.VERSION }}"

      # Setup Docker Buildx (necessário para cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build e Push da imagem Docker
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}/marketplace-search:${{ needs.build.outputs.VERSION }}
            ${{ env.DOCKER_REPO }}/marketplace-search:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main'

    steps:
      # Checkout do código
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deploy da aplicação
      - name: Deploy Application
        run: |
          echo "🚀 Deploy Marketplace Search System"
          echo "Version: ${{ needs.build.outputs.VERSION }}"
          echo "Docker Image: ${{ env.DOCKER_REPO }}/marketplace-search:${{ needs.build.outputs.VERSION }}"
          # TODO: Adicione os comandos para realizar o deploy
          # Exemplos:
          # - kubectl apply -f k8s/
          # - docker-compose -f docker-compose.prod.yml up -d
          # - aws ecs update-service --cluster marketplace --service search-api