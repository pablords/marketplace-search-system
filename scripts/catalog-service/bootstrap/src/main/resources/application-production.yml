spring:
  # Redis para produção
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      ssl: 
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20

# Logging para produção
logging:
  level:
    com.marketplace.search: INFO
    org.springframework.kafka: WARN
    org.elasticsearch: WARN
    org.springframework.data.elasticsearch: WARN
  file:
    name: /var/log/marketplace-search/application.log

# Management para produção
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# Server para produção
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-threads: 200
    min-spare-threads: 20