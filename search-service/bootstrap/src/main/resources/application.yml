spring:
  application:
    name: search-service
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:production}

  output:
    ansi:
      enabled: never
  
  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms


# OpenSearch
opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  scheme: ${OPENSEARCH_SCHEME:http}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index:
    products: ${OPENSEARCH_PRODUCTS_INDEX:products-index}

# ML Ranking Service Configuration
ml:
  ranking:
    service:
      url: ${ML_RANKING_SERVICE_URL:http://localhost:8084}
      timeout-seconds: ${ML_RANKING_SERVICE_TIMEOUT:15}
      max-retries: ${ML_RANKING_SERVICE_MAX_RETRIES:2}
      enabled: ${ML_RANKING_ENABLED:true}
  
  feature-store:
    # Feature Store Online (Redis)
    ttl-seconds: ${ML_FEATURE_STORE_TTL:3600}  # 1 hora
    redis-key-prefix: ${ML_FEATURE_STORE_REDIS_PREFIX:feature:ml:}
    
    # Feature Store Offline (PostgreSQL)
    offline:
      enabled: ${ML_FEATURE_STORE_OFFLINE_ENABLED:true}
      version: ${ML_FEATURE_STORE_VERSION:1.0}
      batch-size: ${ML_FEATURE_STORE_BATCH_SIZE:100}

# Embedding Service Configuration
embedding:
  service:
    url: ${EMBEDDING_SERVICE_URL:http://localhost:8085}
    timeout-seconds: ${EMBEDDING_SERVICE_TIMEOUT:5}
    max-retries: ${EMBEDDING_SERVICE_MAX_RETRIES:3}
    enabled: ${EMBEDDING_SERVICE_ENABLED:true}

# Feature Flags
features:
  ml-ranking:
    enabled: ${FEATURE_ML_RANKING_ENABLED:true}
  feature-store-offline:
    enabled: ${FEATURE_FEATURE_STORE_OFFLINE_ENABLED:true}
  embedding-search:
    enabled: ${FEATURE_EMBEDDING_SEARCH_ENABLED:true}

# Logging
logging:
  level:
    com.marketplace.search: ${LOG_LEVEL:INFO}
    com.marketplace.search.search.infrastructure.ml: ${LOG_LEVEL_ML:INFO}
    com.marketplace.search.search.infrastructure.featurestore: ${LOG_LEVEL_FEATURE_STORE:INFO}


# Management/Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
  metrics:
    export:
      enabled: true
    tags:
      application: marketplace-search-system
      service: search-service
      environment: ${ENVIRONMENT:production}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        search.phase.duration: true
        jvm.gc.pause: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318}/v1/traces

# Server
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /api/v1

# SpringDoc OpenAPI 3
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

resilience4j:
  circuitbreaker:
    instances:
      mlRankingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      embeddingService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

